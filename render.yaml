services:
  - type: web
    name: bluebook-redbook
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: gunicorn backend.main:app --workers 1 --bind 0.0.0.0:$PORT --timeout 120 -k uvicorn.workers.UvicornWorker
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bluebook-redbook-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.4

databases:
  - name: bluebook-redbook-db
    databaseName: bluebook
    user: bluebook
    plan: free
    ipAllowList: []
